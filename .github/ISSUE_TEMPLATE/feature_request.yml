name: Feature request
description: An idea for Quince
labels:
  - enhancement
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should Quince do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you tried or thought of.
