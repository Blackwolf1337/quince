# The Slint frontend (QUINCE_SLINT) while it is being ported: builds both
# frontends on macOS and Windows, and starts quince-slint once on macOS.
name: slint

on:
  push:
    branches: [slint-frontend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: |
          brew install cmake ninja pkgconf qt mpv ffmpeg icu4c
          rustup update stable && rustup default stable
      - name: Build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix icu4c)/lib/pkgconfig:$PKG_CONFIG_PATH"
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUINCE_LOGIN=OFF -DQUINCE_SLINT=ON \
                -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" 2>&1 | tee ci.log
          cmake --build build 2>&1 | tee -a ci.log
      - name: Run
        continue-on-error: true
        run: |
          cd build
          ./quince-slint --ao=null --no-session --play=dQw4w9WgXcQ --quit-after=15000 > run.log 2>&1 &
          pid=$!
          for i in $(seq 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null && echo "killed after 60 s" >> run.log
          # bash -e: a failing wait must not end the step
          rc=0; wait $pid || rc=$?; echo "exit code $rc" >> run.log
          cat run.log
          # one annotation (a step shows at most 10)
          msg=$(grep -aE "test:|exit code|killed|panicked|rror|quince" run.log | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=quince-slint run::$msg"
      - name: Errors as annotations
        if: failure()
        run: |
          grep -aE -A4 "error(\[|:)|Error:|undefined|FAILED|ld: " ci.log 2>/dev/null | grep -v "^--$" | head -45 \
            | sed 's/%/%25/g; s/^/::error::/' || true
          tail -8 ci.log 2>/dev/null | sed 's/%/%25/g; s/^/::warning::/' || true

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-icu
            mingw-w64-ucrt-x86_64-libiconv
      - name: Build
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUINCE_LOGIN=OFF -DQUINCE_SLINT=ON 2>&1 | tee ci.log
          cmake --build build 2>&1 | tee -a ci.log
          ls -la build/quince.exe build/quince-slint.exe
      - name: Errors as annotations
        if: failure()
        run: |
          grep -aE -A4 "error(\[|:)|Error:|undefined|FAILED|ld: " ci.log 2>/dev/null | grep -v "^--$" | head -45 \
            | sed 's/%/%25/g; s/^/::error::/' || true
          tail -8 ci.log 2>/dev/null | sed 's/%/%25/g; s/^/::warning::/' || true
