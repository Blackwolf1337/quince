# Builds Quince for Windows (portable zip), macOS (Quince.app zip) and Arch
# Linux (the tarball of quince-bin); a tag v* makes a release with all three.
name: build

on:
  push:
    branches: [master, packaging, slint-frontend]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-icu
            mingw-w64-ucrt-x86_64-libiconv
      - name: Build
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUINCE_LOGIN=OFF 2>&1 | tee ci.log
          cmake --build build 2>&1 | tee -a ci.log
      - name: Package
        run: |
          set -o pipefail
          exec > >(tee -a ci.log) 2>&1
          dist="$PWD/dist/Quince"
          cmake --install build --prefix "$dist"
          deploy=$(command -v windeployqt6 || command -v windeployqt-qt6 || echo /ucrt64/share/qt6/bin/windeployqt.exe)
          # the window is Slint's: no platform, style or icon plugins
          "$deploy" --release --no-compiler-runtime --skip-plugin-types platforms,styles,iconengines,generic,platforminputcontexts \
            "$dist/quince.exe"
          # MSYS2's Qt would look for plugins below share\qt6\
          cp packaging/windows/qt.conf "$dist/qt.conf"
          # every DLL of the MSYS2 prefix that the exe and the Qt plugins load
          find "$dist" -name '*.exe' -o -name '*.dll' | while read -r f; do ntldd -R "$f"; done \
            | sed -n 's/.*=> \(.*\.dll\) (0x.*/\1/p' | tr '\\' '/' | grep -i '/ucrt64/' | sort -u \
            | while read -r dll; do cp -n "$(cygpath -u "$dll")" "$dist/"; done
          ver=$(git describe --tags --always)
          (cd dist && zip -qr9 "../Quince-$ver-windows-x64.zip" Quince)
          ls -la Quince-*.zip
      - name: Errors as annotations
        if: failure()
        shell: bash
        run: |
          # each error with the lines that explain it (CMake puts them below)
          grep -aiE -A4 "error|failed|undefined reference|cannot find" ci.log 2>/dev/null \
            | grep -v "^--$" | head -45 | sed 's/%/%25/g; s/^/::error::/' || true
          tail -5 ci.log 2>/dev/null | sed 's/%/%25/g; s/^/::warning::/' || true
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Quince-*-windows-x64.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Dependencies
        run: |
          brew install cmake ninja pkgconf qt mpv ffmpeg icu4c dylibbundler
          rustup update stable && rustup default stable
      - name: Build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix icu4c)/lib/pkgconfig:$PKG_CONFIG_PATH"
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUINCE_LOGIN=OFF \
                -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" 2>&1 | tee ci.log
          cmake --build build 2>&1 | tee -a ci.log
      - name: Package
        run: |
          set -o pipefail
          exec > >(tee -a ci.log) 2>&1
          app=build/Quince.app
          # it also fails its own signature check after changing the files; the
          # checks below and the signing at the end decide instead
          "$(brew --prefix qt)/bin/macdeployqt" "$app" -libpath="$(brew --prefix)/lib" \
            || echo "::warning::macdeployqt reported errors"
          # Slint's library (the build copies it to Frameworks): found there, not in the build tree
          slint="$app/Contents/Frameworks/libslint_cpp.dylib"
          install_name_tool -id @rpath/libslint_cpp.dylib "$slint"
          old=$(otool -L "$app/Contents/MacOS/Quince" | awk '/libslint_cpp/ {print $1}')
          new=@executable_path/../Frameworks/libslint_cpp.dylib
          if [ "$old" != "$new" ]; then install_name_tool -change "$old" "$new" "$app/Contents/MacOS/Quince"; fi
          # Homebrew libraries a binary of the bundle still loads (its own id aside)
          brewdeps() {
            find "$app/Contents" -type f \( -name '*.dylib' -o -perm -u+x \) | while read -r f; do
              file "$f" | grep -q Mach-O || continue
              id=$(otool -D "$f" | tail -n +2)
              # no match is the good case: grep's status must not end the step
              otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -E "^(/opt/homebrew|/usr/local/(opt|Cellar)|$PWD)" \
                | grep -vxF "$id" | sed "s|^|$f -> |" || true
            done
          }
          # what macdeployqt left (mpv's libraries, those of the Qt plugins)
          args=()
          for f in $(brewdeps | sed 's/ -> .*//' | sort -u); do args+=(-x "$f"); done
          if [ ${#args[@]} -gt 0 ]; then
            # -s: where @rpath libraries are (it would ask on stdin otherwise)
            dylibbundler -of -b "${args[@]}" -d "$app/Contents/Frameworks" -p @executable_path/../Frameworks/ \
                         -s "$(brew --prefix)/lib" -s "$(brew --prefix qt)/lib" < /dev/null
          fi
          left=$(brewdeps)
          if [ -n "$left" ]; then echo "$left" | head -40 | sed 's/^/::error::/'; exit 1; fi
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ver=$(git describe --tags --always)
          ditto -c -k --keepParent "$app" "Quince-$ver-macos-arm64.zip"
          ls -la Quince-*.zip
      - name: Run
        continue-on-error: true
        run: |
          # the packed app, briefly: it starts, plays and quits by itself
          Quince.app/Contents/MacOS/Quince --ao=null --no-session --play=dQw4w9WgXcQ --quit-after=15000 > run.log 2>&1 &
          pid=$!
          for i in $(seq 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null && echo "killed after 60 s" >> run.log
          # bash -e: a failing wait must not end the step
          rc=0; wait $pid || rc=$?; echo "exit code $rc" >> run.log
          cat run.log
          # one annotation (a step shows at most 10)
          msg=$(grep -aE "test:|exit code|killed|panicked|rror|quince|Library not loaded" run.log | head -30 \
            | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Quince run::$msg"
        working-directory: build
      - name: Errors as annotations
        if: failure()
        shell: bash
        run: |
          # each error with the lines that explain it (CMake puts them below)
          grep -aiE -A4 "error|failed|undefined reference|cannot find" ci.log 2>/dev/null \
            | grep -v "^--$" | head -45 | sed 's/%/%25/g; s/^/::error::/' || true
          tail -5 ci.log 2>/dev/null | sed 's/%/%25/g; s/^/::warning::/' || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Quince-*-macos-arm64.zip

  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja rust qt6-base qt6-tools \
            qt6-webengine mpv ffmpeg icu openssl fontconfig libglvnd
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build
        run: |
          git config --global --add safe.directory "$PWD"
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr 2>&1 | tee ci.log
          cmake --build build 2>&1 | tee -a ci.log
          DESTDIR="$PWD/pkg" cmake --install build
          ver=$(git describe --tags --always)
          tar --zstd -cf "quince-$ver-x86_64.tar.zst" -C pkg usr
          ls -la quince-*.tar.zst
      - name: Errors as annotations
        if: failure()
        shell: bash
        run: |
          # each error with the lines that explain it (CMake puts them below)
          grep -aiE -A4 "error|failed|undefined reference|cannot find" ci.log 2>/dev/null \
            | grep -v "^--$" | head -45 | sed 's/%/%25/g; s/^/::error::/' || true
          tail -5 ci.log 2>/dev/null | sed 's/%/%25/g; s/^/::warning::/' || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: quince-*-x86_64.tar.zst

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Quince ${GITHUB_REF_NAME#v}" \
            --generate-notes Quince-*.zip quince-*.tar.zst
