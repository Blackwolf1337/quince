# Builds Quince for Windows (portable zip), macOS (Quince.app zip) and Arch
# Linux (the tarball of quince-bin); a tag v* makes a release with all three.
name: build

on:
  push:
    branches: [master, packaging]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # the Docker cross-build of packaging/windows (MinGW, MSYS2's libraries, our
    # own small mpv and FFmpeg), as on a developer's Linux machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build
        run: |
          set -o pipefail
          packaging/windows/cross-build.sh "$HOME/.cache/quince-windows" 2>&1 | tee ci.log
      - name: Errors as annotations
        if: failure()
        shell: bash
        run: |
          # each error with the lines that explain it (CMake puts them below)
          grep -aiE -A4 "error|failed|undefined reference|cannot find" ci.log 2>/dev/null \
            | grep -v "^--$" | head -45 | sed 's/%/%25/g; s/^/::error::/' || true
          tail -5 ci.log 2>/dev/null | sed 's/%/%25/g; s/^/::warning::/' || true
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Quince-*-windows-x64.zip

  windows-test:
    # the zip from above on a real Windows: it starts and plays, Windows lists
    # its media session (what the media overlay shows), Google's sign-in lets
    # WebView2 past the email step
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - name: Unpack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Expand-Archive -Path Quince-*-windows-x64.zip -DestinationPath app
          # no GPU and only OpenGL 1.1 on the runner: Mesa's (llvmpipe) next to the program
          gh release download --repo pal1000/mesa-dist-win --pattern '*-release-msvc.7z' --output mesa.7z
          7z x -omesa mesa.7z | Out-Null
          Copy-Item mesa\x64\*.dll app\Quince\
      - name: Run
        run: |
          # errors go into the notes below; the check at the end decides
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $env:QT_FORCE_STDERR_LOGGING = "1"
          # straight to the software renderer (Zink first finds no Vulkan)
          $env:GALLIUM_DRIVER = "llvmpipe"
          $p = Start-Process app\Quince\quince.exe -PassThru -RedirectStandardError run.log -RedirectStandardOutput out.log `
            -ArgumentList "--ao=null", "--no-session", "--play=dQw4w9WgXcQ", "--quit-after=45000"
          Start-Sleep -Seconds 25
          # the sessions Windows knows: app, title, artist, status (Windows PowerShell for WinRT)
          powershell -NoProfile -Command {
            Add-Type -AssemblyName System.Runtime.WindowsRuntime
            $asTask = [System.WindowsRuntimeSystemExtensions].GetMethods() | Where-Object {
              $_.Name -eq 'AsTask' -and $_.GetParameters().Count -eq 1 -and
              $_.GetParameters()[0].ParameterType.Name -eq 'IAsyncOperation`1' } | Select-Object -First 1
            function Await($op, [Type]$type) {
              $task = $asTask.MakeGenericMethod($type).Invoke($null, @($op)); $task.Wait(-1) | Out-Null; $task.Result
            }
            $m = [Windows.Media.Control.GlobalSystemMediaTransportControlsSessionManager, Windows.Media.Control, ContentType = WindowsRuntime]
            $props = [Windows.Media.Control.GlobalSystemMediaTransportControlsSessionMediaProperties, Windows.Media.Control, ContentType = WindowsRuntime]
            $manager = Await ($m::RequestAsync()) $m
            foreach ($s in $manager.GetSessions()) {
              $info = Await ($s.TryGetMediaPropertiesAsync()) $props
              "session: {0} | {1} | {2} | {3}" -f $s.SourceAppUserModelId, $info.Title, $info.Artist, $s.GetPlaybackInfo().PlaybackStatus
            }
          } 2>&1 | Tee-Object -FilePath smtc.log
          if (-not $p.WaitForExit(60000)) { $p.Kill(); "killed after 85 s" | Add-Content run.log }
          "exit code $($p.ExitCode)" | Add-Content run.log
          Get-Content run.log, out.log
          $msg = (Get-Content run.log, smtc.log | Select-String "test:|exit code|killed|panicked|rror|mediacontrols|media controls|session:" |
            Select-Object -First 30 | ForEach-Object { $_.Line -replace '%', '%25' }) -join '%0A'
          "::notice title=Quince run::$msg"
          # a program that does not start fails the job (playback may fail on the network)
          if (-not (Select-String -Quiet "test: position" run.log)) { "::error::quince.exe did not run"; exit 1 }
      - name: Sign-in probe
        continue-on-error: true
        run: |
          # does Google let WebView2 past the email step? ("Couldn't find" yes)
          $p = Start-Process app\Quince\quince-login.exe -PassThru -RedirectStandardError login.log -RedirectStandardOutput out.log `
            -ArgumentList "--probe-email", "quince.probe.x7f3k2q9@gmail.com", "$env:RUNNER_TEMP\c.txt"
          if (-not $p.WaitForExit(60000)) { $p.Kill(); "killed after 60 s" | Add-Content login.log }
          "exit code $($p.ExitCode)" | Add-Content login.log
          Get-Content login.log
          $msg = (Get-Content login.log | Select-Object -First 20 | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
          "::notice title=Sign-in probe::$msg"

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Dependencies
        run: |
          brew install cmake ninja meson nasm pkgconf qt dav1d lame libass icu4c dylibbundler
          rustup update stable && rustup default stable
      - name: mpv and FFmpeg
        run: |
          # Quince's own (packaging/media.sh), in place of Homebrew's with every codec
          set -o pipefail
          packaging/macos/build-media.sh "$RUNNER_TEMP/media-src" "$PWD/media" 2>&1 | tee ci.log
      - name: Build
        run: |
          export PKG_CONFIG_PATH="$PWD/media/lib/pkgconfig:$(brew --prefix icu4c)/lib/pkgconfig:$PKG_CONFIG_PATH"
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" 2>&1 | tee -a ci.log
          cmake --build build 2>&1 | tee -a ci.log
      - name: Package
        run: |
          set -o pipefail
          exec > >(tee -a ci.log) 2>&1
          app=build/Quince.app
          # it also fails its own signature check after changing the files; the
          # checks below and the signing at the end decide instead
          "$(brew --prefix qt)/bin/macdeployqt" "$app" -executable="$app/Contents/MacOS/quince-login" \
            -libpath="$PWD/media/lib" -libpath="$(brew --prefix)/lib" \
            || echo "::warning::macdeployqt reported errors"
          # Slint's library (the build copies it to Frameworks): found there, not in the build tree
          slint="$app/Contents/Frameworks/libslint_cpp.dylib"
          install_name_tool -id @rpath/libslint_cpp.dylib "$slint"
          old=$(otool -L "$app/Contents/MacOS/Quince" | awk '/libslint_cpp/ {print $1}')
          new=@executable_path/../Frameworks/libslint_cpp.dylib
          if [ "$old" != "$new" ]; then install_name_tool -change "$old" "$new" "$app/Contents/MacOS/Quince"; fi
          # local symbols out of what the build made (before signing)
          strip -x "$app/Contents/MacOS/Quince" "$slint"
          # Homebrew libraries a binary of the bundle still loads (its own id aside)
          brewdeps() {
            find "$app/Contents" -type f \( -name '*.dylib' -o -perm -u+x \) | while read -r f; do
              file "$f" | grep -q Mach-O || continue
              id=$(otool -D "$f" | tail -n +2)
              # no match is the good case: grep's status must not end the step
              otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -E "^(/opt/homebrew|/usr/local/(opt|Cellar)|$PWD)" \
                | grep -vxF "$id" | sed "s|^|$f -> |" || true
            done
          }
          # what macdeployqt left (mpv's libraries, those of the Qt plugins)
          args=()
          for f in $(brewdeps | sed 's/ -> .*//' | sort -u); do args+=(-x "$f"); done
          if [ ${#args[@]} -gt 0 ]; then
            # -s: where @rpath libraries are (it would ask on stdin otherwise)
            dylibbundler -of -b "${args[@]}" -d "$app/Contents/Frameworks" -p @executable_path/../Frameworks/ \
                         -s "$PWD/media/lib" -s "$(brew --prefix)/lib" -s "$(brew --prefix qt)/lib" < /dev/null
          fi
          left=$(brewdeps)
          if [ -n "$left" ]; then echo "$left" | head -40 | sed 's/^/::error::/'; exit 1; fi
          packaging/macos/prune.sh "$app"
          packaging/macos/trim-icu.sh "$(ls "$app"/Contents/Frameworks/libicudata.*.dylib)"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ver=$(git describe --tags --always)
          ditto -c -k --keepParent "$app" "Quince-$ver-macos-arm64.zip"
          ls -la Quince-*.zip
          # what the bundle is made of (one annotation)
          msg=$( (du -sh "$app"; find "$app" -type f -size +500k -exec du -h {} + | sort -rh | head -25) \
            | sed "s|$app/Contents/||; s/%/%25/g" | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Quince.app sizes::$msg"
      - name: Run
        run: |
          # the packed app, briefly: it starts, plays and quits by itself
          Quince.app/Contents/MacOS/Quince --ao=null --no-session --play=dQw4w9WgXcQ --quit-after=15000 > run.log 2>&1 &
          pid=$!
          for i in $(seq 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null && echo "killed after 60 s" >> run.log
          # bash -e: a failing wait must not end the step
          rc=0; wait $pid || rc=$?; echo "exit code $rc" >> run.log
          cat run.log
          # one annotation (a step shows at most 10)
          msg=$(grep -aE "test:|exit code|killed|panicked|rror|quince|Library not loaded" run.log | head -30 \
            | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Quince run::$msg"
          # a bundle that does not start fails the job (playback may fail on the network)
          if grep -q "Library not loaded" run.log; then echo "::error::Quince.app does not start"; exit 1; fi
        working-directory: build
      - name: Sign-in probe
        continue-on-error: true
        run: |
          # does Google let WKWebView past the email step? ("Couldn't find" yes)
          Quince.app/Contents/MacOS/quince-login --probe-email quince.probe.x7f3k2q9@gmail.com "$RUNNER_TEMP/c.txt" \
            > login.log 2>&1 &
          pid=$!
          for i in $(seq 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null && echo "killed after 60 s" >> login.log
          msg=$(sed 's/%/%25/g' login.log | head -20 | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Sign-in probe::$msg"
        working-directory: build
      - name: Errors as annotations
        if: failure()
        shell: bash
        run: |
          # each error with the lines that explain it (CMake puts them below)
          grep -aiE -A4 "error|failed|undefined reference|cannot find" ci.log 2>/dev/null \
            | grep -v "^--$" | head -45 | sed 's/%/%25/g; s/^/::error::/' || true
          tail -5 ci.log 2>/dev/null | sed 's/%/%25/g; s/^/::warning::/' || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Quince-*-macos-arm64.zip

  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja rust qt6-base qt6-tools \
            webkitgtk-6.0 mpv ffmpeg icu openssl fontconfig libglvnd
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build
        run: |
          git config --global --add safe.directory "$PWD"
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr 2>&1 | tee ci.log
          cmake --build build 2>&1 | tee -a ci.log
          # stripped: quince-bin's PKGBUILD takes the binaries as they are (!strip)
          DESTDIR="$PWD/pkg" cmake --install build --strip
          ver=$(git describe --tags --always)
          tar --zstd -cf "quince-$ver-x86_64.tar.zst" -C pkg usr
          ls -la quince-*.tar.zst
      - name: Errors as annotations
        if: failure()
        shell: bash
        run: |
          # each error with the lines that explain it (CMake puts them below)
          grep -aiE -A4 "error|failed|undefined reference|cannot find" ci.log 2>/dev/null \
            | grep -v "^--$" | head -45 | sed 's/%/%25/g; s/^/::error::/' || true
          tail -5 ci.log 2>/dev/null | sed 's/%/%25/g; s/^/::warning::/' || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: quince-*-x86_64.tar.zst

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the notes: this version's part of CHANGELOG.md, else GitHub's list of commits
          ver=${GITHUB_REF_NAME#v}
          awk -v v="## $ver" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Quince $ver" \
            "${notes[@]}" Quince-*.zip quince-*.tar.zst
